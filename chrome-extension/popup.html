<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 240px; padding: 16px; color: #111; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  p { font-size: 12px; color: #666; margin: 4px 0; line-height: 1.4; }
  button { margin-top: 10px; background: #e44332; color: white; border: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
  button:hover { background: #c0392b; }
  a { font-size: 11px; color: #e44332; display: inline-block; margin-top: 10px; }
</style>
</head>
<body>
  <h3>History Capture</h3>
  <p id="lastScan">Last scan: never</p>
  <p id="lastResult"></p>
  <button id="scanNow">Scan now</button>
  <br>
  <a href="#" id="openOptions">Settings</a>
  <script src="popup.js"></script>
</body>
</html>
